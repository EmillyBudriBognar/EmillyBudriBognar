<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 26" width="1000" height="26" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="dv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#9333ea" stop-opacity="0"/>
      <stop offset="24%"  stop-color="#9333ea" stop-opacity=".55"/>
      <stop offset="50%"  stop-color="#7e22ce" stop-opacity=".85"/>
      <stop offset="76%"  stop-color="#2563eb" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <style>
      .faisca { animation: faisca 6s ease-in-out infinite }
      @keyframes faisca { 0%{transform:translateX(-40px);opacity:0} 12%{opacity:1} 88%{opacity:1} 100%{transform:translateX(1040px);opacity:0} }
      .pulsa { animation: pulsa 3.2s ease-in-out infinite }
      @keyframes pulsa { 0%,100%{transform:scale(1);opacity:.7} 50%{transform:scale(1.6);opacity:.2} }
      @media (prefers-reduced-motion: reduce) { .pulsa{animation:none} .faisca{animation:none;opacity:0} }
    </style>
  </defs>
  <rect x="0" y="12" width="1000" height="2" rx="1" fill="url(#dv)"/>
  <g class="pulsa" style="transform-origin:500px 13px"><circle cx="500" cy="13" r="5" fill="#9333ea"/></g>
  <circle cx="500" cy="13" r="2.4" fill="#7e22ce"/>
  <g class="faisca"><circle cx="0" cy="13" r="2.6" fill="#9333ea"/></g>
</svg>
