<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" role="img" aria-label="Emilly Budri - UX Designer, Front-End Developer e Shopify Developer. Tornando o digital simples, humano e inesquecível.">
  <defs>
    <linearGradient id="hFundo" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#251749"/>
      <stop offset="50%" stop-color="#150b28"/>
      <stop offset="100%" stop-color="#1e1039"/>
    </linearGradient>
    <radialGradient id="hGlow" cx="50%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#a930cb" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#a930cb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hBolhaA" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#b06cf0" stop-opacity="0.2"/><stop offset="100%" stop-color="#b06cf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hBolhaB" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#5b8def" stop-opacity="0.18"/><stop offset="100%" stop-color="#5b8def" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hNome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f7f5ff"/>
      <stop offset="46%"  stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="hRegua" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="hFaixa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a1b8a"/><stop offset="52%" stop-color="#7d23cd"/><stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="hBrilho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="hCard"><rect width="1000" height="370" rx="30"/></clipPath>
    <clipPath id="hFaixaClip"><rect x="0" y="320" width="1000" height="50"/></clipPath>
    <mask id="hBrilhoMask">
      <rect width="1000" height="370" fill="#000"/>
      <rect class="brilho" x="-260" y="0" width="260" height="370" fill="url(#hBrilho)"/>
    </mask>

    <style>
      /* as bolhas do site, cada uma no seu ritmo */
      .fl1 { animation: fl1 11s ease-in-out infinite }
      .fl2 { animation: fl2 14s ease-in-out infinite }
      .fl3 { animation: fl3 17s ease-in-out infinite }
      @keyframes fl1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(9px,-16px)} }
      @keyframes fl2 { 0%,100%{transform:translate(0,0)} 33%{transform:translate(-11px,-9px)} 66%{transform:translate(6px,-18px)} }
      @keyframes fl3 { 0%,100%{transform:translate(0,0)} 40%{transform:translate(13px,-7px)} 75%{transform:translate(-8px,-14px)} }

      .deriva  { animation: deriva 26s ease-in-out infinite alternate }
      @keyframes deriva { from{transform:translate(0,0)} to{transform:translate(52px,-26px)} }
      .deriva2 { animation: deriva2 32s ease-in-out infinite alternate }
      @keyframes deriva2 { from{transform:translate(0,0)} to{transform:translate(-46px,20px)} }

      .respira { animation: respira 7s ease-in-out infinite }
      @keyframes respira { 0%,100%{opacity:.5;transform:scaleY(.94)} 50%{opacity:1;transform:scaleY(1.04)} }

      .brilho { animation: brilho 7s ease-in-out 1.4s infinite }
      @keyframes brilho { 0%{transform:translateX(0)} 46%,100%{transform:translateX(1300px)} }

      .sobe  { animation: sobe 1s cubic-bezier(.2,.7,.3,1) both }
      .sobe2 { animation: sobe 1s cubic-bezier(.2,.7,.3,1) .14s both }
      .sobe3 { animation: sobe 1s cubic-bezier(.2,.7,.3,1) .28s both }
      .sobe4 { animation: sobe 1s cubic-bezier(.2,.7,.3,1) .42s both }
      @keyframes sobe { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

      .cresce { transform-origin:500px 0; animation: cresce 1.1s cubic-bezier(.2,.7,.3,1) .5s both }
      @keyframes cresce { from{transform:scaleX(0)} to{transform:scaleX(1)} }

      .marcha { animation: marcha 24s linear infinite }
      @keyframes marcha { from{transform:translateX(0)} to{transform:translateX(-1000px)} }

      .pisca { animation: pisca 3.4s ease-in-out infinite }
      .q2 { animation-delay: 1.1s } .q3 { animation-delay: 2.2s }
      @keyframes pisca { 0%,100%{opacity:.4} 50%{opacity:1} }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important }
      }
    </style>
  </defs>

  <g clip-path="url(#hCard)">
    <rect width="1000" height="370" fill="url(#hFundo)"/>

    <g class="deriva"><ellipse cx="150" cy="70" rx="330" ry="190" fill="url(#hBolhaA)"/></g>
    <g class="deriva2"><ellipse cx="880" cy="90" rx="310" ry="180" fill="url(#hBolhaB)"/></g>
    <ellipse class="respira" style="transform-origin:500px 370px" cx="500" cy="370" rx="520" ry="280" fill="url(#hGlow)"/>

    <g fill="none" stroke-width="3">
      <g class="fl1" style="animation-delay:.2s"  stroke="#c084fc" opacity=".5"><circle cx="82" cy="108" r="18"/><circle cx="82" cy="108" r="9.5" stroke-width="2"/></g>
      <g class="fl2" style="animation-delay:1.4s" stroke="#f7f5ff" opacity=".28"><circle cx="60" cy="232" r="10"/></g>
      <g class="fl3" style="animation-delay:2.3s" stroke="#c084fc" opacity=".4"><circle cx="146" cy="284" r="7"/><circle cx="146" cy="284" r="3.2" fill="#c084fc" stroke="none"/></g>
      <g class="fl2" style="animation-delay:.8s"  stroke="#f7f5ff" opacity=".26"><circle cx="924" cy="114" r="20"/></g>
      <g class="fl3" style="animation-delay:1.9s" stroke="#c084fc" opacity=".45"><circle cx="948" cy="238" r="11"/><circle cx="948" cy="238" r="5" fill="#c084fc" stroke="none"/></g>
      <g class="fl1" style="animation-delay:.5s"  stroke="#f7f5ff" opacity=".22"><circle cx="862" cy="288" r="8"/></g>
    </g>

    <g font-family="Jost, Century Gothic, Futura, Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
      <text class="sobe" x="500" y="70" font-size="11.5" letter-spacing="4.2" fill="#8d85ac">OLÁ, EU SOU A EMILLY. PODE ME CHAMAR DE BUDRI</text>

      <g class="sobe2">
        <text x="500" y="146" font-size="68" font-weight="700" letter-spacing="1.6" fill="url(#hNome)">EMILLY BUDRI</text>
        <text x="500" y="146" font-size="68" font-weight="700" letter-spacing="1.6" fill="#ffffff" mask="url(#hBrilhoMask)">EMILLY BUDRI</text>
      </g>
      <rect class="cresce" x="448" y="162" width="104" height="4" rx="2" fill="url(#hRegua)"/>

      <text class="sobe3" x="500" y="200" font-size="19" font-weight="700" letter-spacing="3.2" fill="#b8b0d6">TORNANDO O DIGITAL SIMPLES,</text>
      <text class="sobe3" x="500" y="224" font-size="19" font-weight="700" letter-spacing="3.2" fill="#c084fc">HUMANO &amp; INESQUECÍVEL.</text>

      <g class="sobe4" font-size="12" letter-spacing="2.6" fill="#b8b0d6">
        <text x="500" y="266">
          <tspan>UX DESIGNER</tspan><tspan fill="#a855f7">&#160;&#160;&#183;&#160;&#160;</tspan><tspan>FRONT-END DEVELOPER</tspan><tspan fill="#a855f7">&#160;&#160;&#183;&#160;&#160;</tspan><tspan>SHOPIFY DEVELOPER</tspan>
        </text>
      </g>
    </g>

    <g clip-path="url(#hFaixaClip)">
      <rect x="0" y="320" width="1000" height="50" fill="url(#hFaixa)"/>
      <g class="marcha" font-family="Jost, Century Gothic, Futura, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="4.2" fill="#f4e9fe" text-anchor="middle">
        <g>
          <text x="92" y="350">CRIATIVIDADE</text><text x="300" y="350">INOVAÇÃO</text><text x="470" y="350">EMPATIA</text>
          <text x="640" y="350">INTENÇÃO</text><text x="850" y="350">ADAPTABILIDADE</text>
          <g fill="#c9a0fd"><circle cx="196" cy="345" r="2.8"/><circle cx="386" cy="345" r="2.8"/><circle cx="556" cy="345" r="2.8"/><circle cx="746" cy="345" r="2.8"/><circle cx="952" cy="345" r="2.8"/></g>
        </g>
        <g transform="translate(1000,0)">
          <text x="92" y="350">CRIATIVIDADE</text><text x="300" y="350">INOVAÇÃO</text><text x="470" y="350">EMPATIA</text>
          <text x="640" y="350">INTENÇÃO</text><text x="850" y="350">ADAPTABILIDADE</text>
          <g fill="#c9a0fd"><circle cx="196" cy="345" r="2.8"/><circle cx="386" cy="345" r="2.8"/><circle cx="556" cy="345" r="2.8"/><circle cx="746" cy="345" r="2.8"/><circle cx="952" cy="345" r="2.8"/></g>
        </g>
      </g>
    </g>

    <rect x="1" y="1" width="998" height="368" rx="30" fill="none" stroke="#a855f7" stroke-opacity=".2" stroke-width="2"/>
  </g>
</svg>
