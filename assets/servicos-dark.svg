<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 292" width="1000" height="292" role="img" aria-label="Serviços: 01 UX e UI Design, 02 Desenvolvimento Front-End, 03 Email Marketing, 04 Design Gráfico">
  <defs>
    <linearGradient id="sBrilho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sSombra" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#c084fc" flood-opacity="0.14"/>
    </filter>
    <clipPath id="sc1"><rect x="21"  y="12" width="226" height="264" rx="28"/></clipPath>
    <clipPath id="sc2"><rect x="265" y="12" width="226" height="264" rx="28"/></clipPath>
    <clipPath id="sc3"><rect x="509" y="12" width="226" height="264" rx="28"/></clipPath>
    <clipPath id="sc4"><rect x="753" y="12" width="226" height="264" rx="28"/></clipPath>
    <style>
      .card{animation:sobe 1s cubic-bezier(.2,.7,.3,1) both}
      .c2{animation-delay:.1s}.c3{animation-delay:.2s}.c4{animation-delay:.3s}
      @keyframes sobe{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
      .ico{animation:ico 5s ease-in-out infinite}
      .i2{animation-delay:.6s}.i3{animation-delay:1.2s}.i4{animation-delay:1.8s}
      @keyframes ico{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      .luz{animation:luz 10s ease-in-out infinite}
      .z2{animation-delay:.8s}.z3{animation-delay:1.6s}.z4{animation-delay:2.4s}
      @keyframes luz{0%{transform:translateX(-160px);opacity:0}5%{opacity:1}24%{transform:translateX(420px);opacity:0}100%{transform:translateX(420px);opacity:0}}
      .num{animation:num 7s ease-in-out infinite}
      @keyframes num{0%,100%{opacity:.16}50%{opacity:.3}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>

  <g font-family="Jost, Century Gothic, Futura, Segoe UI, Arial, sans-serif">

    <!-- 01 -->
    <g class="card">
      <g filter="url(#sSombra)"><rect x="21" y="12" width="226" height="264" rx="28" fill="#251749" stroke="#c084fc" stroke-opacity=".26" stroke-width="1.5"/></g>
      <g clip-path="url(#sc1)"><rect class="luz" x="21" y="12" width="130" height="264" fill="url(#sBrilho)" opacity=".5"/></g>
      <text class="num" x="222" y="72" font-size="48" font-weight="700" text-anchor="end" fill="#c084fc">01</text>
      <g class="ico">
        <rect x="45" y="36" width="48" height="48" rx="16" fill="#c084fc" fill-opacity=".12"/>
        <rect x="58" y="49" width="22" height="18" rx="4" fill="none" stroke="#c084fc" stroke-width="1.8"/>
        <path d="M71 62 l0 13 3.2 -4.4 3.2 6.4 3.2 -1.5 -3.2 -6.4 4.8 0 z" fill="#c084fc"/>
      </g>
      <text x="45" y="124" font-size="15.5" font-weight="700" letter-spacing="1.5" fill="#f7f5ff">UX/UI DESIGN</text>
      <rect x="45" y="134" width="40" height="3.5" rx="1.75" fill="#c084fc"/>
      <g font-size="11.5" fill="#b8b0d6">
        <text x="45" y="164">Interfaces claras, nascidas</text>
        <text x="45" y="182">de pesquisa e validadas em</text>
        <text x="45" y="200">protótipo antes do código.</text>
      </g>
      <g font-size="8.8" letter-spacing="1.5" fill="#c084fc">
        <text x="45" y="230">PESQUISA &#183; PROTOTIPAGEM</text>
        <text x="45" y="246">DESIGN SYSTEMS</text>
      </g>
    </g>

    <!-- 02 -->
    <g class="card c2">
      <g filter="url(#sSombra)"><rect x="265" y="12" width="226" height="264" rx="28" fill="#251749" stroke="#60a5fa" stroke-opacity=".26" stroke-width="1.5"/></g>
      <g clip-path="url(#sc2)"><rect class="luz z2" x="265" y="12" width="130" height="264" fill="url(#sBrilho)" opacity=".5"/></g>
      <text class="num" x="466" y="72" font-size="48" font-weight="700" text-anchor="end" fill="#60a5fa">02</text>
      <g class="ico i2">
        <rect x="289" y="36" width="48" height="48" rx="16" fill="#60a5fa" fill-opacity=".12"/>
        <path d="M306 52 l-7 8 7 8 M320 52 l7 8 -7 8 M316 49 l-6 22" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="289" y="124" font-size="15.5" font-weight="700" letter-spacing="1.5" fill="#f7f5ff">FRONT-END</text>
      <rect x="289" y="134" width="40" height="3.5" rx="1.75" fill="#60a5fa"/>
      <g font-size="11.5" fill="#b8b0d6">
        <text x="289" y="164">Web e mobile com foco em</text>
        <text x="289" y="182">performance, acessibilidade</text>
        <text x="289" y="200">e integração com APIs.</text>
      </g>
      <g font-size="8.8" letter-spacing="1.5" fill="#60a5fa">
        <text x="289" y="230">WEB &#183; MOBILE</text>
        <text x="289" y="246">PERFORMANCE</text>
      </g>
    </g>

    <!-- 03 -->
    <g class="card c3">
      <g filter="url(#sSombra)"><rect x="509" y="12" width="226" height="264" rx="28" fill="#251749" stroke="#f472b6" stroke-opacity=".26" stroke-width="1.5"/></g>
      <g clip-path="url(#sc3)"><rect class="luz z3" x="509" y="12" width="130" height="264" fill="url(#sBrilho)" opacity=".5"/></g>
      <text class="num" x="710" y="72" font-size="48" font-weight="700" text-anchor="end" fill="#f472b6">03</text>
      <g class="ico i3">
        <rect x="533" y="36" width="48" height="48" rx="16" fill="#f472b6" fill-opacity=".12"/>
        <rect x="546" y="50" width="22" height="16" rx="3.5" fill="none" stroke="#f472b6" stroke-width="1.8"/>
        <path d="M546.5 52 l10.5 8 10.5 -8" fill="none" stroke="#f472b6" stroke-width="1.8" stroke-linejoin="round"/>
      </g>
      <text x="533" y="124" font-size="15.5" font-weight="700" letter-spacing="1.5" fill="#f7f5ff">EMAIL MARKETING</text>
      <rect x="533" y="134" width="40" height="3.5" rx="1.75" fill="#f472b6"/>
      <g font-size="11.5" fill="#b8b0d6">
        <text x="533" y="164">E-mails responsivos, fiéis</text>
        <text x="533" y="182">à identidade da marca e</text>
        <text x="533" y="200">desenhados para converter.</text>
      </g>
      <g font-size="8.8" letter-spacing="1.5" fill="#f472b6">
        <text x="533" y="230">TEMPLATES &#183; RESPONSIVO</text>
        <text x="533" y="246">CONVERSÃO</text>
      </g>
    </g>

    <!-- 04 -->
    <g class="card c4">
      <g filter="url(#sSombra)"><rect x="753" y="12" width="226" height="264" rx="28" fill="#251749" stroke="#fb923c" stroke-opacity=".26" stroke-width="1.5"/></g>
      <g clip-path="url(#sc4)"><rect class="luz z4" x="753" y="12" width="130" height="264" fill="url(#sBrilho)" opacity=".5"/></g>
      <text class="num" x="954" y="72" font-size="48" font-weight="700" text-anchor="end" fill="#fb923c">04</text>
      <g class="ico i4">
        <rect x="777" y="36" width="48" height="48" rx="16" fill="#fb923c" fill-opacity=".12"/>
        <circle cx="795" cy="55" r="8" fill="#fb923c" fill-opacity=".55"/>
        <circle cx="806" cy="63" r="8" fill="#f472b6" fill-opacity=".5"/>
        <circle cx="800.5" cy="66" r="3.6" fill="#251749"/>
      </g>
      <text x="777" y="124" font-size="15.5" font-weight="700" letter-spacing="1.5" fill="#f7f5ff">DESIGN GRÁFICO</text>
      <rect x="777" y="134" width="40" height="3.5" rx="1.75" fill="#fb923c"/>
      <g font-size="11.5" fill="#b8b0d6">
        <text x="777" y="164">Identidade visual coerente,</text>
        <text x="777" y="182">do logotipo às aplicações,</text>
        <text x="777" y="200">pensada para durar.</text>
      </g>
      <g font-size="8.8" letter-spacing="1.5" fill="#fb923c">
        <text x="777" y="230">BRANDING &#183; LOGOTIPOS</text>
        <text x="777" y="246">IDENTIDADE VISUAL</text>
      </g>
    </g>
  </g>
</svg>
